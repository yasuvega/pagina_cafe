<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Contact</title>
</head>
<body>

       <header class="header">
        <div class="contenedor">

            <div class="barra">

                <a href="index.html" class="logo">
                    <h1 class="logo__nombre no-margin centrar-texto">Yasu's<span class="logo__bold">Café</span></h1>
                </a>

                <nav class="navegacion">
                    <a href="Nosotros.html" class="navegacion__enlace">About us</a>
                    <a href="cursos.html" class="navegacion__enlace">Curses</a>
                    <a href="contacto.html" class="navegacion__enlace">Contact</a>
                </nav>

            </div>
        </div>
            


        <div class="header__texto">
            <h2 class="no-margin">Sweet moments start here</h2>
            <p class="no-margin">Because coffee always tastes better when it's shared with the ones you love most. </p>
        </div>

   </header>

   <main class="contenedor">
        <h2 class="centrar-texto">Contactanos</h2>

        <div class="contacto-bg"></div>

            <form class="formulario">

                <div class="campo">
                    <label  class="campo__label" for="nombre">Nombre</label>
                    <input type="text" placeholder="Nombre" id="nombre" class="campo__field">
                </div>

                <div class="campo">
                    <label  class="campo__label" for="E-mail">E-mail</label>
                    <input class="campo__field type="email" placeholder="Email" id="E-mail">
                </div>

                <div class="campo">
                    <label  class="campo__label" for="mensaje">Mensaje</label>
                    <textarea class=" campo__field  campo__field--textarea" id="mensaje"></textarea>
                </div>

                <div class="campo">
                    <input type="submit" value="Enviar" class="botton botton--primario">
                </div>


            </form>
            
        




   </main>



   <footer class="footer">

    <div class="contenedor">

        <div class="barra">

                <a href="index.html" class="logo">
                    <h1 class="logo__nombre no-margin centrar-texto">Yasu's<span class="logo__bold">Café</span></h1>
                </a>

                <nav class="navegacion">
                    <a href="Nosotros.html" class="navegacion__enlace">About us</a>
                    <a href="cursos.html" class="navegacion__enlace">Curses</a>
                    <a href="contacto.html" class="navegacion__enlace">Contact</a>
                </nav>

            </div>
        </div>

    </div>
    
   </footer>
    
</body>
</html>
